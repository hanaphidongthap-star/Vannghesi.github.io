<style type="text/tailwindcss">
  @theme {
    --color-canvas:   #fafafa;
    --color-surface:  #ffffff;
    --color-line:     #e2e8f0;
    --color-ink:      #0f172a;
    --color-inksoft:  #475569;
    --color-inkmute:  #94a3b8;
    --color-sky:      #0ea5e9;
    --color-emerald:  #10b981;
    --color-amber:    #f59e0b;
    --color-danger:   #ef4444;

    --radius-card: 12px;
    --radius-ctl:  8px;

    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  @layer base {
    html { -webkit-text-size-adjust: 100%; }
    body { @apply bg-canvas text-ink font-sans text-[15px] antialiased; }
    * { min-width: 0; }
    summary::-webkit-details-marker { display: none; }
  }

  @utility stack { display: flex; flex-direction: column; }
  @utility row   { display: flex; align-items: center; }

  @layer components {
    .card      { @apply bg-surface border border-line rounded-card; }

    .btn       { @apply inline-flex items-center justify-center gap-1.5 h-9 px-3 rounded-ctl border border-line
                        bg-surface text-ink text-[13px] font-medium leading-none whitespace-nowrap cursor-pointer
                        transition-colors hover:bg-canvas
                        focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky
                        disabled:opacity-40 disabled:cursor-not-allowed; }
    .btn-primary { @apply bg-sky border-sky text-white hover:bg-sky/90; }
    .btn-danger  { @apply text-danger border-line hover:bg-danger/5 hover:border-danger/40; }
    .btn-sm      { @apply h-8 px-2.5 text-[12px]; }
    .btn-icon    { @apply h-8 w-8 px-0; }

    .input     { @apply h-9 w-full px-3 rounded-ctl border border-line bg-surface text-ink text-sm
                        placeholder:text-inkmute transition-colors
                        focus:border-sky focus:outline-none; }
    .textarea  { @apply w-full p-3 rounded-ctl border border-line bg-surface text-ink text-sm leading-relaxed
                        placeholder:text-inkmute focus:border-sky focus:outline-none; }
    .label     { @apply block text-[13px] font-medium text-inksoft mb-1.5; }
    .hint      { @apply text-[12px] text-inkmute leading-relaxed; }

    .badge     { @apply inline-flex items-center gap-1 h-[22px] px-2 rounded-ctl text-[11px] font-semibold whitespace-nowrap; }
    .badge-ok  { @apply bg-emerald/10 text-emerald; }
    .badge-app  { @apply bg-amber/10 text-amber; }
    .badge-neutral { @apply bg-canvas text-inksoft border border-line; }

    .tab       { @apply relative h-10 px-4 text-sm font-medium text-inksoft cursor-pointer
                        border-b-2 border-transparent transition-colors hover:text-ink
                        focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky; }
    .tab-on    { @apply text-sky border-sky; }

    .slotcell  { @apply inline-flex items-center justify-center gap-1 h-9 px-3 rounded-ctl border border-line
                        bg-surface text-[12px] text-inkmute cursor-pointer transition-colors
                        hover:border-sky/50
                        focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky; }
    .slotcell-on { @apply bg-sky/10 border-sky text-sky font-semibold; }

    .th        { @apply text-left text-[12px] font-semibold text-inksoft px-3 py-2 border-b border-line whitespace-nowrap; }
    .td        { @apply text-[13px] px-3 py-2.5 border-b border-line align-middle; }

    .icon      { @apply w-4 h-4 shrink-0; }
  }
</style>
</head>

<body>
<div class="mx-auto w-full max-w-[800px] px-4 pb-24 pt-6 sm:pt-10">

  <!-- HEADER -->
  <header class="row justify-between gap-3 mb-4">
    <div class="stack gap-0.5 min-w-0">
      <h1 class="text-[19px] font-bold tracking-tight leading-tight">Lịch rảnh tập văn nghệ</h1>
      <p id="groupName" class="hint truncate">—</p>
    </div>
    <button class="btn" data-action="open-admin">
      <i data-lucide="lock" class="icon"></i> Quản trị
    </button>
  </header>

  <!-- SESSION BAR -->
  <div id="sessionBar" class="mb-3"></div>

  <!-- WARNING BANNER -->

  <!-- MAIN VIEW -->
  <main id="view" class="stack gap-4"></main>

  <footer class="hint mt-10 text-center">
    Lịch rảnh nhóm — Minimalist Web App

</div>

<!-- ADMIN MODAL -->
<div id="adminOverlay" class="hidden fixed inset-0 z-40 bg-ink/20 p-3 sm:p-6 overflow-y-auto">
  <div id="adminModal" class="card mx-auto w-full max-w-[760px] shadow-lg"
       role="dialog" aria-modal="true" aria-labelledby="adminTitle"></div>
</div>

<!-- TOASTS -->
<div id="toasts" aria-live="polite" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 stack gap-2 items-center w-[calc(100%-2rem)] max-w-[420px]"></div>

<input type="file" id="importFile" accept="application/json,.json,.xlsx,.xls" class="hidden" />

<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTS & MESSAGES
     ============================================================ */
  const DAYS = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ nhật'];
  const STORE_PREFIX = 'lichranh:';
  const DEFAULT_PIN = '1412';
  const OTHER = '__other__';
  const STATE_VERSION = 3;

  function getDaySlots(di) {
    if (di >= 0 && di <= 4) { // Thứ 2 -> Thứ 6
      return [
        { id: 's_1930_2100', label: '19h30 - 21h00' },
        { id: 's_2130_2230', label: '21h00 - 22h30' }
      ];
    } else { // Thứ 7, Chủ nhật
      return [
        { id: 's_1800_1930', label: '18h00 - 19h30' }
      ];
    }
  }

  const MSG = {
    saved: 'Đã lưu.',
    regNew: 'Đã ghi nhận lịch rảnh của bạn.',
    regUpd: 'Đã cập nhật lại đăng ký của bạn.',
    needName: 'Vui lòng nhập họ tên.',
    needOther: 'Vui lòng ghi rõ tên tiết mục khác.',
    needAct: 'Vui lòng chọn ít nhất 1 tiết mục.',
    needSlot: 'Hãy chọn ít nhất một khung giờ bạn rảnh.',
    copied: 'Đã copy link nhóm.',
    copyFail: 'Không copy được, hãy copy link thủ công.',
    wrongPin: 'Mã PIN không đúng.',
    pinChanged: 'Đã đổi mã PIN thành công.',
    pinMismatch: 'Mã PIN mới không khớp.',
    pinShort: 'Mã PIN cần ít nhất 4 ký tự.',
    storeFail: 'Không lưu được dữ liệu.',
    importOk: 'Đã nhập dữ liệu nhóm thành công.',
    importFail: 'Tệp JSON không hợp lệ.',
    importExcelOk: 'Đã nhập dữ liệu Excel thành công.',
    importExcelFail: 'Tệp Excel không hợp lệ hoặc lỗi đọc file.',
    exportExcelOk: 'Đã xuất file Excel đăng ký thành công.',
    autoDone: 'Đã tự động xếp lịch dựa theo ưu tiên.',
    noData: 'Chưa có dữ liệu để xuất.'
  };

  /* ============================================================
     UTILS
     ============================================================ */
  const el = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  const groupCode = () => Math.random().toString(36).slice(2, 8);

  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const norm = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('vi');
  const icon = (name, cls) => `<i data-lucide="${name}" class="icon ${cls || ''}"></i>`;

  function toast(message, type) {
    const tone = type === 'danger' ? 'border-danger/40 text-danger'
      : type === 'warn' ? 'border-amber/40 text-amber'
      : 'border-emerald/40 text-emerald';
    const node = document.createElement('div');
    node.className = `card ${tone} w-full px-4 py-2.5 text-[13px] font-medium text-center shadow-sm`;
    node.textContent = message;
    el('toasts').appendChild(node);
    setTimeout(() => node.remove(), 3200);
  }

  function downloadBlob(filename, mime, text) {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const drawIcons = () => { if (window.lucide) window.lucide.createIcons(); };

  const fmtDateTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  };

  /* ============================================================
     SESSION & URL HANDLING
     ============================================================ */
  function getGroupId() {
    const params = new URLSearchParams(location.search);
    let id = (params.get('id') || '').trim();
    if (!/^[a-z0-9]{4,16}$/i.test(id)) {
      id = groupCode();
      params.set('id', id);
      history.replaceState(null, '', `${location.pathname}?${params.toString()}${location.hash}`);
    }
    return id;
  }

  function shareLink(id) {
    return `${location.origin}${location.pathname}?id=${id}`;
  }

  async function copyShareLink() {
    const link = shareLink(state.groupId);
    try {
      if (navigator.clipboard && location.protocol !== 'file:') {
        await navigator.clipboard.writeText(link);
      } else {
        const ta = document.createElement('textarea');
        ta.value = link; ta.setAttribute('readonly', '');
        ta.className = 'fixed opacity-0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      toast(MSG.copied);
    } catch (e) {
      toast(MSG.copyFail, 'danger');
    }
  }

  function openNewGroup() {
    location.href = `${location.pathname}?id=${groupCode()}`;
  }

  /* ============================================================
     STATE & STORE
     ============================================================ */
  function blankState(groupId) {
    return {
      version: STATE_VERSION,
      groupId,
      groupName: 'Nhóm ' + groupId,
      pin: DEFAULT_PIN,
      acts: [
        { id: uid(), name: 'Tết Đầy Đủ', target: 8, choreographer: 'Nguyễn Văn A', priority: 1, maxSessions: 3, choreoAvailability: {} },
        { id: uid(), name: 'Múa Quạt', target: 6, choreographer: 'Trần Thị B', priority: 2, maxSessions: 2, choreoAvailability: {} }
      ],
      members: [],
      schedule: {},
      deadline: '',
      expected: []
    };
  }

  function migrate(raw, groupId) {
    const base = blankState(groupId);
    if (!raw || typeof raw !== 'object') return base;

    const members = (Array.isArray(raw.members) ? raw.members : []).map(m => {
      if (!m.actIds) m.actIds = m.actId ? [m.actId] : [];
      return m;
    });

    const acts = (Array.isArray(raw.acts) ? raw.acts : base.acts).map((a, idx) => ({
      id: a.id || uid(),
      name: a.name || 'Tiết mục',
      target: Number(a.target) || 1,
      choreographer: a.choreographer || '',
      priority: typeof a.priority === 'number' ? a.priority : (idx + 1),
      maxSessions: typeof a.maxSessions === 'number' ? a.maxSessions : 3,
      choreoAvailability: a.choreoAvailability && typeof a.choreoAvailability === 'object' ? a.choreoAvailability : {}
    }));

    return {
      version: STATE_VERSION,
      groupId,
      groupName: typeof raw.groupName === 'string' && raw.groupName ? raw.groupName : base.groupName,
      pin: typeof raw.pin === 'string' && raw.pin ? raw.pin : DEFAULT_PIN,
      acts: acts,
      members: members,
      schedule: raw.schedule && typeof raw.schedule === 'object' ? raw.schedule : {},
      deadline: typeof raw.deadline === 'string' ? raw.deadline : '',
      expected: Array.isArray(raw.expected) ? raw.expected : []
    };
  }

  let state = null;

  function load(groupId) {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_PREFIX + groupId) || 'null'); } catch (e) { raw = null; }
    return raw ? migrate(raw, groupId) : blankState(groupId);
  }

  function save() {
    try {
      localStorage.setItem(STORE_PREFIX + state.groupId, JSON.stringify(state));
    } catch (e) {
      toast(MSG.storeFail, 'danger');
    }
  }

  /* ============================================================
     SELECTORS & HELPERS
     ============================================================ */
  const actById = (id) => state.acts.find((a) => a.id === id) || null;
  const cellKey = (day, slotId) => `${day}:${slotId}`;

  function getCellSchedule(key) {
    const raw = state.schedule[key];
    if (!raw) return [];
    if (Array.isArray(raw)) return raw.filter(x => x && x.actId);
    if (raw.actId) return [{ actId: raw.actId, supervisor: raw.supervisor || '' }];
    return [];
  }

  const memberActName = (m) => {
    const ids = m.actIds || [];
    if (!ids.length) return 'Chưa rõ';
    const names = ids.map(id => {
      if (id === OTHER) return m.actOther ? `Khác (${m.actOther})` : 'Khác';
      const act = actById(id);
      return act ? act.name : 'Đã xoá';
    });
    return names.join(', ');
  };

  function isMemberInAct(m, actId) {
    const ids = m.actIds || [];
    return ids.includes(actId);
  }

  function getActMembers(actId) {
    return state.members.filter(m => isMemberInAct(m, actId));
  }

  function isFree(member, day, slotId) {
    const list = member.availability && member.availability[day];
    return Array.isArray(list) && list.indexOf(slotId) !== -1;
  }

  // Kiểm tra lịch rảnh của Biên đạo
  function isChoreoFree(act, day, slotId, strict = false) {
    if (!act || !act.choreoAvailability) return !strict;
    let hasAnySlot = false;
    Object.values(act.choreoAvailability).forEach(arr => {
      if (Array.isArray(arr) && arr.length > 0) hasAnySlot = true;
    });
    if (!hasAnySlot) return !strict; // Nếu chưa cài đặt slot nào -> Mặc định rảnh ngoại trừ chế độ strict check giao diện

    const list = act.choreoAvailability[day];
    return Array.isArray(list) && list.includes(slotId);
  }

  function freeMembers(day, slotId, actId) {
    return state.members.filter((m) => isFree(m, day, slotId) && (!actId || isMemberInAct(m, actId)));
  }

  function checkConflict(actId1, actId2, day, slotId) {
    if (!actId1 || !actId2 || actId1 === actId2) return null;
    const f1 = freeMembers(day, slotId, actId1);
    const f2 = freeMembers(day, slotId, actId2);
    const overlaps = f1.filter(m1 => f2.some(m2 => m2.id === m1.id));
    return overlaps.length > 0 ? overlaps : null;
  }

  function membersByAct() {
    const groups = state.acts.map((a) => ({ key: a.id, name: a.name, act: a, list: [] }));
    const other = { key: OTHER, name: 'Khác / chưa xác định', act: null, list: [] };

    state.members.forEach((m) => {
      const ids = m.actIds || [];
      let assigned = false;
      ids.forEach((id) => {
        const g = groups.find((x) => x.key === id);
        if (g) { g.list.push(m); assigned = true; }
        else if (id === OTHER) { other.list.push(m); assigned = true; }
      });
      if (!assigned) other.list.push(m);
    });

    if (other.list.length) groups.push(other);
    return groups;
  }

  const isDeadlinePassed = () => !!state.deadline && new Date(state.deadline).getTime() < Date.now();

  function missingMembers() {
    const registered = new Set(state.members.map((m) => norm(m.name)));
    return state.expected.filter((n) => !registered.has(norm(n)));
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  function upsertMember(draft) {
    const idx = state.members.findIndex((m) => norm(m.name) === norm(draft.name));
    const record = {
      id: idx >= 0 ? state.members[idx].id : uid(),
      name: draft.name.trim().replace(/\s+/g, ' '),
      actIds: Array.isArray(draft.actIds) ? draft.actIds : [],
      actOther: draft.actIds.includes(OTHER) ? (draft.actOther || '').trim() : '',
      apprentice: !!draft.apprentice,
      availability: draft.availability,
      updatedAt: Date.now()
    };
    if (idx >= 0) state.members[idx] = record; else state.members.push(record);
    save();
    return idx >= 0;
  }

  // TỰ ĐỘNG XẾP LỊCH CÓ NÂNG CẤP: ƯU TIÊN TIẾT MỤC, CÀI ĐẶT SỐ CA VÀ LỊCH BIÊN ĐẠO
  function autoSchedule(overwrite) {
    if (!state.acts.length) { toast('Hãy tạo tiết mục trước khi xếp lịch.', 'warn'); return; }
    const loadCount = {};
    state.acts.forEach((a) => { loadCount[a.id] = 0; });

    if (!overwrite) {
      Object.values(state.schedule).forEach((items) => {
        const list = Array.isArray(items) ? items : [items];
        list.forEach(v => { if (v && v.actId && loadCount[v.actId] != null) loadCount[v.actId]++; });
      });
    } else {
      state.schedule = {};
    }

    // Sắp xếp các tiết mục theo độ ưu tiên (Priority số nhỏ hơn xếp trước)
    const sortedActs = [...state.acts].sort((a, b) => (a.priority || 99) - (b.priority || 99));

    DAYS.forEach((_, day) => {
      const slots = getDaySlots(day);
      slots.forEach((slot) => {
        const key = cellKey(day, slot.id);
        let existing = overwrite ? [] : getCellSchedule(key);

        // Đợt 1: Xếp tiết mục chính trong khung giờ
        if (existing.length === 0) {
          let best1 = null;
          sortedActs.forEach((act, order) => {
            // 1. Kiểm tra giới hạn số ca tập đã đặt cho tiết mục
            const maxS = act.maxSessions != null ? Number(act.maxSessions) : 99;
            if (loadCount[act.id] >= maxS) return;

            // 2. Số lượng thành viên rảnh
            const free = freeMembers(day, slot.id, act.id).length;
            if (!free) return;

            // 3. Ưu tiên Lịch Biên Đạo (+100 điểm nếu Biên Đạo rảnh)
            const choreoOK = isChoreoFree(act, day, slot.id);
            const choreoScore = choreoOK ? 100 : 0;

            // 4. Ưu tiên Tiết mục (Độ ưu tiên càng thấp/cao hơn điểm càng nhiều)
            const priorityScore = (100 - (act.priority || 1) * 10);

            // Tổng điểm xếp lịch
            const score = (free / Math.max(1, Number(act.target) || 0)) * 10 + choreoScore + priorityScore;

            const cand = { act, score, load: loadCount[act.id], order };
            if (!best1 || cand.score > best1.score ||
               (cand.score === best1.score && cand.load < best1.load)) best1 = cand;
          });
          if (best1) {
            existing.push({ actId: best1.act.id, supervisor: best1.act.choreographer || '' });
            loadCount[best1.act.id]++;
          }
        }

        // Đợt 2: Xếp tiết mục ghép thứ 2 (nếu không đụng nhân sự)
        if (existing.length === 1) {
          const firstActId = existing[0].actId;
          let best2 = null;
          sortedActs.forEach((act, order) => {
            if (act.id === firstActId) return;

            // 1. Kiểm tra giới hạn số ca tập
            const maxS = act.maxSessions != null ? Number(act.maxSessions) : 99;
            if (loadCount[act.id] >= maxS) return;

            // 2. Kiểm tra xung đột trùng người với tiết mục 1
            if (checkConflict(firstActId, act.id, day, slot.id)) return;

            const free = freeMembers(day, slot.id, act.id).length;
            if (!free) return;

            // 3. Ưu tiên Lịch Biên đạo
            const choreoOK = isChoreoFree(act, day, slot.id);
            const choreoScore = choreoOK ? 100 : 0;

            // 4. Ưu tiên Tiết mục
            const priorityScore = (100 - (act.priority || 1) * 10);

            const score = (free / Math.max(1, Number(act.target) || 0)) * 10 + choreoScore + priorityScore;

            const cand = { act, score, load: loadCount[act.id], order };
            if (!best2 || cand.score > best2.score ||
               (cand.score === best2.score && cand.load < best2.load)) best2 = cand;
          });
          if (best2) {
            existing.push({ actId: best2.act.id, supervisor: best2.act.choreographer || '' });
            loadCount[best2.act.id]++;
          }
        }

        if (existing.length) {
          state.schedule[key] = existing;
        } else if (overwrite) {
          delete state.schedule[key];
        }
      });
    });
    save();
    toast(MSG.autoDone);
  }

  /* ============================================================
     EXCEL EXPORT / IMPORT
     ============================================================ */
  function exportExcel() {
    if (typeof XLSX === 'undefined') {
      toast('Chưa tải xong thư viện Excel, vui lòng thử lại sau vài giây.', 'danger');
      return;
    }
    if (!state.members.length && !state.acts.length) {
      toast(MSG.noData, 'warn');
      return;
    }

    const wb = XLSX.utils.book_new();

    const memberHeaders = [
      'Dấu thời gian',
      'Họ và Tên của bạn',
      'Vote những ngày bạn có thể vào tập được',
      'Tiết mục của bạn'
    ];

    const memberRows = [memberHeaders];

    state.members.forEach((m) => {
      const freeSlotsTextList = [];
      DAYS.forEach((dayName, di) => {
        const slots = getDaySlots(di);
        slots.forEach(s => {
          if (isFree(m, di, s.id)) {
            freeSlotsTextList.push(`${dayName} (${s.label})`);
          }
        });
      });

      const freeSummary = freeSlotsTextList.length ? freeSlotsTextList.join(', ') : 'Bận cả tuần';

      memberRows.push([
        fmtDateTime(m.updatedAt || Date.now()),
        m.name,
        freeSummary,
        memberActName(m)
      ]);
    });

    const wsMembers = XLSX.utils.aoa_to_sheet(memberRows);
    XLSX.utils.book_append_sheet(wb, wsMembers, 'Danh sách Đăng ký');

    const schedRows = [['Ngày', 'Khung giờ', 'Tiết mục', 'Người phụ trách', 'Số bạn rảnh', 'Chỉ tiêu']];
    DAYS.forEach((dayName, di) => {
      const slots = getDaySlots(di);
      slots.forEach((slot) => {
        const items = getCellSchedule(cellKey(di, slot.id));
        if (!items.length) {
          schedRows.push([dayName, slot.label, 'Chưa có lịch', '', '', '']);
        } else {
          items.forEach(item => {
            const act = item.actId ? actById(item.actId) : null;
            schedRows.push([
              dayName,
              slot.label,
              act ? act.name : '',
              item.supervisor || '',
              act ? freeMembers(di, slot.id, act.id).length : freeMembers(di, slot.id).length,
              act ? (act.target || '') : ''
            ]);
          });
        }
      });
    });
    const wsSched = XLSX.utils.aoa_to_sheet(schedRows);
    XLSX.utils.book_append_sheet(wb, wsSched, 'Lịch tập chung');

    XLSX.writeFile(wb, `danh-sach-dang-ky-${state.groupId}.xlsx`);
    toast(MSG.exportExcelOk);
  }

  function importExcel(file) {
    if (typeof XLSX === 'undefined') {
      toast('Chưa tải xong thư viện Excel.', 'danger');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        let importedMembers = 0;

        const sheetName = workbook.SheetNames[0];
        if (sheetName) {
          const sheet = workbook.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(sheet);

          json.forEach(row => {
            const name = row['Họ và Tên của bạn'] || row['Họ và Tên'] || row['Họ tên'] || row['Tên'] || row['Name'];
            if (!name) return;

            const actStr = String(row['Tiết mục của bạn'] || row['Tiết mục đăng ký'] || row['Tiết mục'] || '');
            const actIds = [];
            state.acts.forEach(a => {
              if (actStr.toLowerCase().includes(a.name.toLowerCase())) {
                actIds.push(a.id);
              }
            });
            if (!actIds.length && actStr) {
              actIds.push(OTHER);
            }

            const voteStr = String(row['Vote những ngày bạn có thể vào tập được'] || row['Ngày rảnh'] || '');
            const availability = {};
            DAYS.forEach((_, di) => { availability[di] = []; });

            DAYS.forEach((dayName, di) => {
              const slots = getDaySlots(di);
              slots.forEach(s => {
                const searchPattern = `${dayName} (${s.label})`;
                if (voteStr.includes(searchPattern) || (voteStr.includes(dayName) && voteStr.includes(s.label))) {
                  availability[di].push(s.id);
                }
              });
            });

            const draftItem = {
              name: String(name).trim(),
              actIds: actIds.length ? actIds : (state.acts[0] ? [state.acts[0].id] : []),
              actOther: actIds.includes(OTHER) ? actStr : '',
              apprentice: false,
              availability
            };

            upsertMember(draftItem);
            importedMembers++;
          });
        }

        save();
        renderAll();
        toast(`Đã nhập thành công ${importedMembers} thành viên từ Excel.`);
      } catch (err) {
        console.error(err);
        toast(MSG.importExcelFail, 'danger');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportCSV() {
    const q = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const rows = [['Dấu thời gian', 'Họ và Tên của bạn', 'Vote những ngày bạn có thể vào tập được', 'Tiết mục của bạn']];
    state.members.forEach((m) => {
      const freeSlotsTextList = [];
      DAYS.forEach((dayName, di) => {
        getDaySlots(di).forEach(s => {
          if (isFree(m, di, s.id)) freeSlotsTextList.push(`${dayName} (${s.label})`);
        });
      });
      rows.push([
        fmtDateTime(m.updatedAt || Date.now()),
        m.name,
        freeSlotsTextList.join(', '),
        memberActName(m)
      ]);
    });
    const csv = '\uFEFF' + rows.map((r) => r.map(q).join(',')).join('\r\n');
    downloadBlob(`lich-tap-${state.groupId}.csv`, 'text/csv;charset=utf-8', csv);
  }

  function exportJSON() {
    downloadBlob(`lichranh-${state.groupId}.json`, 'application/json', JSON.stringify(state, null, 2));
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(String(reader.result));
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.members)) throw new Error('bad');
        state = migrate(raw, state.groupId);
        save();
        renderAll();
        toast(MSG.importOk);
      } catch (e) {
        toast(MSG.importFail, 'danger');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

                  <span class="text-sm font-semibold text-ink">${esc(a.name)}</span>
                </div>
                <span class="hint">Chỉ tiêu: ${a.target || 0} người · Biên đạo: ${esc(a.choreographer || 'Chưa có')} · Ca tập cần xếp: <strong class="text-sky">${a.maxSessions || 3} ca/tuần</strong></span>
              </div>
              <button class="btn btn-sm btn-danger btn-icon" data-action="del-act" data-id="${a.id}">${icon('trash-2')}</button>
            </div>

            <!-- Cài đặt lịch rảnh cho Biên đạo -->
            <details class="mt-1 text-xs border border-line/80 rounded-ctl p-2 bg-canvas/40">
              <summary class="cursor-pointer font-medium text-sky hover:underline flex items-center gap-1 select-none">
                ${icon('calendar')} Cài đặt khung giờ rảnh của Biên đạo (${esc(a.choreographer || 'Biên đạo')})
              </summary>
              <p class="hint my-1 mt-2 text-[11px]">Chọn các ca Biên đạo rảnh để hệ thống tự động ưu tiên xếp lịch. Nếu không chọn ca nào, hệ thống xem như Biên đạo rảnh tất cả các ca.</p>
              <div class="grid gap-2 sm:grid-cols-2 mt-2">
                ${DAYS.map((dayName, di) => `
                  <div class="stack gap-1 p-1.5 bg-surface rounded border border-line">
                    <span class="font-semibold text-[11px] text-inksoft">${dayName}</span>
                    <div class="flex flex-wrap gap-1">
                      ${getDaySlots(di).map(s => {
                        const checked = isChoreoFree(a, di, s.id, true);
                        return `
                          <button type="button" class="slotcell ${checked ? 'slotcell-on' : ''} text-[11px] py-1 h-7 px-2"
                            data-action="toggle-choreo-slot" data-actid="${a.id}" data-day="${di}" data-slot="${s.id}">
                            ${checked ? icon('check', 'w-3 h-3 text-sky') : ''} ${s.label}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </details>

            <div class="pt-2 border-t border-line/60 stack gap-1">
              <span class="text-[12px] font-medium text-inksoft">Thành viên đã chọn tiết mục này (${registered.length}):</span>
              <div class="flex flex-wrap gap-1">
                ${registered.length ? registered.map(m => `<span class="badge ${m.apprentice ? 'badge-app' : 'badge-ok'}">${esc(m.name)}</span>`).join('') : '<span class="hint italic">Chưa có ai đăng ký</span>'}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <form id="actForm" class="stack gap-3 pt-3 border-t border-line">
        <h4 class="text-xs font-semibold uppercase text-inksoft">Thêm tiết mục mới</h4>
        <div class="grid gap-2 sm:grid-cols-2">
          <div>
            <label class="label">Tên tiết mục <span class="text-danger">*</span></label>
            <input class="input" id="aName" placeholder="Tên tiết mục" required />
          </div>
          <div>
            <label class="label">Tên Biên đạo</label>
            <input class="input" id="aChoreo" placeholder="Tên biên đạo" />
          </div>
          <div>
            <label class="label">Số lượng thành viên chỉ tiêu</label>
            <input class="input" id="aTarget" type="number" min="1" value="8" required />
          </div>
          <div>
            <label class="label">Độ ưu tiên xếp lịch (1 = Ưu tiên cao nhất)</label>
            <input class="input" id="aPriority" type="number" min="1" value="1" required />
          </div>
          <div class="sm:col-span-2">
            <label class="label">Số ca tập cần xếp/tuần</label>
            <input class="input" id="aMaxSessions" type="number" min="1" max="14" value="3" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary self-start">${icon('plus')} Thêm tiết mục</button>
      </form>
    </div>`;
  }

  function adminBuilderHTML() {
    return `
    <div class="stack gap-4">
      <div class="card p-3 bg-sky/5 border-sky/30 text-xs stack gap-1">
        <span class="font-semibold text-sky">💡 Quy tắc Tự động xếp lịch:</span>
        <span>1. <strong>Độ ưu tiên Tiết mục</strong>: Xếp tiết mục ưu tiên cao hơn trước.</span>
        <span>2. <strong>Lịch rảnh Biên đạo</strong>: Ưu tiên chọn các ca trùng lịch rảnh của biên đạo.</span>
        <span>3. <strong>Đặt số lượng ca tập</strong>: Tự dừng khi tiết mục đã đủ số ca/tuần quy định.</span>
        <span>4. <strong>Tối ưu số bạn rảnh</strong>: Chọn ca có nhiều bạn rảnh nhất.</span>
      </div>

      <div class="row justify-between gap-2">
        <h3 class="text-sm font-semibold">Phân chia lịch tập (Tối đa 2 tiết mục/khung giờ)</h3>
        <button class="btn btn-sm btn-primary" data-action="auto-schedule">${icon('wand-2')} Tự động xếp lịch thông minh</button>
      </div>

      <form id="schedForm" class="stack gap-4 max-h-[460px] overflow-y-auto pr-1">
        ${DAYS.map((day, di) => {
          const slots = getDaySlots(di);
          return `
          <div class="stack gap-2 border-b border-line pb-4">
            <span class="text-xs font-semibold text-inksoft uppercase">${esc(day)}</span>
            <div class="grid gap-3 sm:grid-cols-2">
              ${slots.map((s) => {
                const k = cellKey(di, s.id);
                const items = getCellSchedule(k);
                const act1 = items[0] || { actId: '', supervisor: '' };
                const act2 = items[1] || { actId: '', supervisor: '' };

                const conflict = checkConflict(act1.actId, act2.actId, di, s.id);

                return `
                <div class="p-3 border ${conflict ? 'border-danger bg-danger/5' : 'border-line bg-canvas'} rounded-ctl stack gap-2">
                  <div class="row justify-between items-center">
                    <span class="text-[12px] font-semibold">${esc(s.label)}</span>
                    ${conflict ? `<span class="badge bg-danger/10 text-danger text-[10px]" title="Trùng: ${conflict.map(m=>m.name).join(', ')}">⚠️ Đụng nhân sự (${conflict.length})</span>` : ''}
                  </div>

                  <!-- Tiết mục 1 -->
                  <div class="stack gap-1">
                    <span class="text-[11px] font-medium text-inksoft">Tiết mục 1:</span>
                    <select class="input text-xs" name="act1_${k}">
                      <option value="">-- Trống --</option>
                      ${state.acts.map(a => {
                        const count = freeMembers(di, s.id, a.id).length;
                        const cFree = isChoreoFree(a, di, s.id) ? ' · BĐ Rảnh' : '';
                        return `<option value="${a.id}" ${act1.actId === a.id ? 'selected' : ''}>[ƯU TIÊN ${a.priority || 1}] ${esc(a.name)} (${count} bạn rảnh${cFree})</option>`;
                      }).join('')}
                    </select>
                    <input class="input text-xs" name="sup1_${k}" placeholder="Người phụ trách 1" value="${esc(act1.supervisor || '')}" />
                  </div>

                  <!-- Tiết mục 2 -->
                  <div class="stack gap-1 border-t border-line/60 pt-1.5">
                    <span class="text-[11px] font-medium text-inksoft">Tiết mục 2 (Tùy chọn):</span>
                    <select class="input text-xs" name="act2_${k}">
                      <option value="">-- Không xếp thêm --</option>
                      ${state.acts.map(a => {
                        const count = freeMembers(di, s.id, a.id).length;
                        const cFree = isChoreoFree(a, di, s.id) ? ' · BĐ Rảnh' : '';
                        return `<option value="${a.id}" ${act2.actId === a.id ? 'selected' : ''}>[ƯU TIÊN ${a.priority || 1}] ${esc(a.name)} (${count} bạn rảnh${cFree})</option>`;
                      }).join('')}
                    </select>
                    <input class="input text-xs" name="sup2_${k}" placeholder="Người phụ trách 2" value="${esc(act2.supervisor || '')}" />
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
        <button type="submit" class="btn btn-primary self-start">${icon('save')} Lưu xếp lịch</button>
      </form>
    </div>`;
  }

  function adminSettingsHTML() {
    return `
    <div class="stack gap-5">
      <form id="groupSettingsForm" class="stack gap-3 border-b border-line pb-4">
        <h3 class="text-sm font-semibold">Cấu hình nhóm & Hạn nộp</h3>
        <div>
          <label class="label">Tên nhóm</label>
          <input class="input" id="gNameInp" value="${esc(state.groupName)}" required />
        </div>
        <div>
          <label class="label">Hạn chót đăng ký</label>
          <input class="input" type="datetime-local" id="gDeadlineInp" value="${state.deadline || ''}" />
        </div>
        <div>
          <label class="label">Danh sách thành viên dự kiến (Mỗi tên 1 dòng)</label>
          <textarea class="textarea" id="gExpectedInp" rows="3" placeholder="Nguyễn Văn A&#10;Trần Thị B">${esc(state.expected.join('\n'))}</textarea>
        </div>
        <button type="submit" class="btn btn-primary self-start">${icon('save')} Cập nhật cấu hình</button>
      </form>

      <form id="changePinForm" class="stack gap-3 border-b border-line pb-4">
        <h3 class="text-sm font-semibold">Đổi mã PIN Quản trị</h3>
        <div class="grid gap-2 sm:grid-cols-2">
          <input class="input" type="password" id="oldPinInp" placeholder="Mã PIN cũ" required />
          <input class="input" type="password" id="newPinInp" placeholder="Mã PIN mới" required />
        </div>
        <button type="submit" class="btn btn-primary self-start">${icon('key')} Đổi PIN</button>
      </form>

      <div class="stack gap-2">
        <h3 class="text-sm font-semibold text-danger">Vùng nguy hiểm</h3>
        <button class="btn btn-danger self-start" data-action="reset-group">${icon('trash-2')} Reset toàn bộ dữ liệu nhóm</button>
      </div>
    </div>`;
  }

  function renderAdmin() {
    const overlay = el('adminOverlay');
    const modal = el('adminModal');
    if (!ui.adminOpen) {
      overlay.classList.add('hidden');
      return;
    }
    overlay.classList.remove('hidden');
    modal.innerHTML = ui.adminAuthed ? adminDashboardHTML() : pinGateHTML();
    drawIcons();
  }

  function renderAll() {
    renderSessionBar();
    renderWarning();
    renderTabs();
    renderView();
    renderAdmin();
  }

  /* ============================================================
     EVENT LISTENERS (DELEGATION)
     ============================================================ */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'open-admin') { ui.adminOpen = true; renderAdmin(); }
    else if (action === 'close-admin') { ui.adminOpen = false; renderAdmin(); }
    else if (action === 'toggle-pin-vis') { ui.pinVisible = !ui.pinVisible; renderAdmin(); }
    else if (action === 'admin-sec') { ui.adminSection = btn.dataset.sec; renderAdmin(); }
    else if (action === 'copy-link') { copyShareLink(); }
    else if (action === 'new-group') { openNewGroup(); }
    else if (action === 'export-excel') { exportExcel(); }
    else if (action === 'import-excel') { el('importFile').click(); }
    else if (action === 'export-json') { exportJSON(); }
    else if (action === 'export-csv') { exportCSV(); }
    else if (action === 'tab') { ui.tab = btn.dataset.tab; renderTabs(); renderView(); }
    else if (action === 'clear-grid') {
      DAYS.forEach((_, i) => { draft.availability[i] = []; });
      renderGrid();
    }
    else if (action === 'reset-draft') {
      draft = blankDraft();
      renderView();
    }
    else if (action === 'toggle-slot') {
      const day = parseInt(btn.dataset.day, 10);
      const slot = btn.dataset.slot;
      const arr = draft.availability[day] || [];
      const idx = arr.indexOf(slot);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(slot);
      draft.availability[day] = arr;
      renderGrid();
    }
    else if (action === 'toggle-choreo-slot') {
      const actId = btn.dataset.actid;
      const day = parseInt(btn.dataset.day, 10);
      const slot = btn.dataset.slot;

      const act = actById(actId);
      if (act) {
        if (!act.choreoAvailability) act.choreoAvailability = {};
        if (!act.choreoAvailability[day]) act.choreoAvailability[day] = [];

        const arr = act.choreoAvailability[day];
        const idx = arr.indexOf(slot);
        if (idx >= 0) arr.splice(idx, 1);
        else arr.push(slot);

        save();
        renderAdmin();
      }
    }
    else if (action === 'del-act') {
      const id = btn.dataset.id;
      state.acts = state.acts.filter(a => a.id !== id);
      save(); renderAll(); toast('Đã xoá tiết mục.');
    }
    else if (action === 'del-member') {
      const id = btn.dataset.id;
      state.members = state.members.filter(m => m.id !== id);
      save(); renderAll(); toast('Đã xoá thành viên.');
    }
    else if (action === 'auto-schedule') {
      autoSchedule(true);
      renderAdmin();
      renderView();
    }
    else if (action === 'reset-group') {
      resetGroup();
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'importFile' && e.target.files.length) {
      const file = e.target.files[0];
      const fn = file.name.toLowerCase();
      if (fn.endsWith('.xlsx') || fn.endsWith('.xls')) {
        importExcel(file);
      } else if (fn.endsWith('.json')) {
        importJSON(file);
      } else {
        toast('Vui lòng chọn file .xlsx, .xls hoặc .json', 'warn');
      }
      e.target.value = '';
    }
    if (e.target.classList.contains('act-checkbox')) {
      const checkedBoxes = document.querySelectorAll('.act-checkbox:checked');
      draft.actIds = Array.from(checkedBoxes).map(cb => cb.value);
      const otherBox = el('otherBox');
      if (otherBox) {
        if (draft.actIds.includes(OTHER)) otherBox.classList.remove('hidden');
        else otherBox.classList.add('hidden');
      }
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'fName') draft.name = e.target.value;
    if (e.target.id === 'fOther') draft.actOther = e.target.value;
    if (e.target.id === 'fApprentice') draft.apprentice = e.target.checked;
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = e.target.id;

    if (id === 'pinForm') {
      const val = el('pinInp').value;
      if (val === state.pin) {
        ui.adminAuthed = true;
        renderAdmin();
      } else {
        toast(MSG.wrongPin, 'danger');
      }
    }
    else if (id === 'regForm') {
      if (!draft.name.trim()) { toast(MSG.needName, 'warn'); return; }
      if (!draft.actIds.length) { toast(MSG.needAct, 'warn'); return; }
      if (draft.actIds.includes(OTHER) && !draft.actOther.trim()) { toast(MSG.needOther, 'warn'); return; }
      const hasSlot = Object.values(draft.availability).some(arr => arr.length > 0);
      if (!hasSlot) { toast(MSG.needSlot, 'warn'); return; }

      const isUpdate = upsertMember(draft);
      toast(isUpdate ? MSG.regUpd : MSG.regNew);
      draft = blankDraft();
      renderAll();
    }
    else if (id === 'actForm') {
      const name = el('aName').value.trim();
      const target = parseInt(el('aTarget').value, 10) || 1;
      const choreographer = el('aChoreo').value.trim();
      const priority = parseInt(el('aPriority').value, 10) || 1;
      const maxSessions = parseInt(el('aMaxSessions').value, 10) || 3;

      if (name) {
        state.acts.push({
          id: uid(),
          name,
          target,
          choreographer,
          priority,
          maxSessions,
          choreoAvailability: {}
        });
        save(); renderAdmin(); renderView();
        toast('Đã thêm tiết mục.');
      }
    }
    else if (id === 'schedForm') {
      const form = e.target;
      let hasConflictFound = false;

      DAYS.forEach((_, di) => {
        getDaySlots(di).forEach(s => {
          const k = cellKey(di, s.id);
          const act1Id = form[`act1_${k}`].value;
          const sup1 = form[`sup1_${k}`].value.trim();
          const act2Id = form[`act2_${k}`].value;
          const sup2 = form[`sup2_${k}`].value.trim();

          const list = [];
          if (act1Id) list.push({ actId: act1Id, supervisor: sup1 });
          if (act2Id && act2Id !== act1Id) list.push({ actId: act2Id, supervisor: sup2 });

          if (act1Id && act2Id && checkConflict(act1Id, act2Id, di, s.id)) {
            hasConflictFound = true;
          }

          if (list.length) state.schedule[k] = list;
          else delete state.schedule[k];
        });
      });
      save();
      renderView();
      renderAdmin();

      if (hasConflictFound) {
        toast('Đã lưu lịch nhưng có ca bị trùng nhân sự! Vui lòng kiểm tra lại.', 'warn');
      } else {
        toast(MSG.saved);
      }
    }
    else if (id === 'groupSettingsForm') {
      state.groupName = el('gNameInp').value.trim() || state.groupName;
      state.deadline = el('gDeadlineInp').value;
      state.expected = el('gExpectedInp').value.split('\n').map(s => s.trim()).filter(Boolean);
      save(); renderAll(); toast(MSG.saved);
    }
    else if (id === 'changePinForm') {
      const oldP = el('oldPinInp').value;
      const newP = el('newPinInp').value;
      if (oldP !== state.pin) { toast(MSG.wrongPin, 'danger'); return; }
      if (newP.length < 4) { toast(MSG.pinShort, 'warn'); return; }
      state.pin = newP;
      save(); renderAdmin(); toast(MSG.pinChanged);
    }
  });

  /* ============================================================
     INITIALIZATION
     ============================================================ */
  const groupId = getGroupId();
  state = load(groupId);
  renderAll();

})();
</script>
</body>
</html>
